openapi: 3.1.1
info:
  title: 数字记忆博物馆 API
  version: 1.0.0
  description: |
    软件历史博物馆（数字记忆博物馆）后端 HTTP 接口。覆盖已实现能力与待实现能力：
    已实现——注册、登录、会话、退出，系列创建/图标/列表/详情，版本创建/版本链/详情，截图上传与读取；
    设计待实现——收藏、评论与回复、编辑/删除/修改历史/贡献者、草稿与发布、个人资料与公开档案、
    标签与来源与版本图标、修改与找回密码、服务端搜索与统计（标记 `x-implementation-status: design`）。

    ## 通用约定
    - 基地址：开发环境 `http://127.0.0.1:8080`，所有路径以 `/api` 开头，JSON 为 UTF-8。
    - 认证：登录成功写入 HttpOnly Cookie `museum_access_token`（JWT，HS256，30 分钟，`Path=/api`，`SameSite=Lax`）。
      浏览器统一携带 `credentials: 'include'`；接口不返回 Token，也不使用 `Authorization` 头。
    - 写请求（POST/PUT/PATCH/DELETE）同时要求白名单 `Origin` 与 `X-App-Request: museum-web`，
      缺任一项返回 403 `REQUEST_FORBIDDEN`。GET 请求不要求上述头。
    - 所有 ID 为 UUID 字符串；时间为 ISO-8601 UTC，例如 `2026-10-30T08:00:00Z`；日期为 `YYYY-MM-DD`。
    - 分页响应统一 `{items, page, size, totalElements, totalPages}`，`page` 从 0 开始，`size` 取值 1～100（省略为 20）。
    - 错误响应统一 `{code, message, requestId, fieldErrors}`，响应头含 `X-Request-Id` 与 `Cache-Control: no-store`。
    - 未知 JSON 字段、类型错误、UUID 格式错误一律 400，不静默忽略（`fail-on-unknown-properties`）。
    - 上传：multipart 单文件上限 5 MiB、整请求 6 MiB；图标/头像业务上限 2 MiB。

    ## 实现状态
    每个操作带 `x-implementation-status`：`implemented` 与当前后端一致；`design` 来自 `backend/docs/` 的设计文档，
    实施时还需同步 `SecurityConfig`（CORS 增加 PUT/PATCH/DELETE、逐条放行新路径）、`BusinessRequestPaths` 与上传目录。
  contact:
    name: 数字记忆博物馆
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: 认证
    description: 注册、登录、会话、退出、邮箱验证与找回密码
  - name: 个人资料
    description: 本人资料、头像、公开档案与贡献记录
  - name: 系列
    description: 软件系列（含图标、草稿、发布、收藏、统计）
  - name: 版本
    description: 系列下的版本（原型中的「内容」），含三态字段、版本图标、讨论与收藏
  - name: 截图
    description: 版本截图的上传、读取与说明修改
  - name: 评论
    description: 版本讨论的顶层评论与回复
  - name: 修订
    description: 修改历史与贡献者
  - name: 草稿
    description: 我的草稿箱与素材
  - name: 标签
    description: 全局标签池与自动补全
  - name: 搜索与统计
    description: 服务端搜索、站点/平台/时间线/系列统计

paths:
  /api/auth/register:
    post:
      tags: [认证]
      operationId: registerUser
      summary: 注册
      description: |
        用户名 + 密码注册，邮箱可选（当前不做邮箱验证）。用户名去首尾空白后必须匹配 `[A-Za-z0-9_]{2,32}`，
        统一转小写保存；密码按 Unicode 码点计 4～64。同一 IP 每分钟最多 10 次。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
            example:
              username: museum_fan
              password: museum-passphrase-2026
              email: museum@example.com
      responses:
        '201':
          description: 注册成功，返回新建用户（不含令牌，需另行登录）
          headers:
            Cache-Control: {schema: {type: string}, example: 'no-store'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthUserResponse'}
              example:
                user: {id: 0b6f3c1e-8f0a-4f5d-9c3a-2a1f6f0d7c11, username: museum_fan, email: museum@example.com}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/RequestForbidden'}
        '409':
          description: 用户名已存在（`USERNAME_ALREADY_EXISTS`）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: USERNAME_ALREADY_EXISTS, message: 用户名已被占用, requestId: '3f2c9b1e', fieldErrors: {}}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/auth/login:
    post:
      tags: [认证]
      operationId: loginUser
      summary: 登录
      description: |
        校验用户名与密码，成功写入 `museum_access_token`（HttpOnly、Secure、SameSite=Lax、Path=/api、Max-Age=1800），
        正文只返回用户与过期时间。密码错误、账号不存在、账号停用统一返回 401 `INVALID_CREDENTIALS`。
      x-implementation-status: implemented
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example: {username: museum_fan, password: museum-passphrase-2026}
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              description: JWT Cookie，HttpOnly，前端不可读取
              schema: {type: string}
              example: 'museum_access_token=<JWT>; Path=/api; Max-Age=1800; HttpOnly; Secure; SameSite=Lax'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              example:
                user: {id: 0b6f3c1e-8f0a-4f5d-9c3a-2a1f6f0d7c11, username: museum_fan, email: museum@example.com}
                expiresAt: '2026-10-30T08:30:00Z'
        '400': {$ref: '#/components/responses/ValidationError'}
        '401':
          description: 用户名或密码错误（`INVALID_CREDENTIALS`）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: INVALID_CREDENTIALS, message: 用户名或密码错误, requestId: '3f2c9b1e', fieldErrors: {}}
        '403': {$ref: '#/components/responses/RequestForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/auth/me:
    get:
      tags: [认证]
      operationId: getCurrentUser
      summary: 当前登录用户
      description: 校验 Cookie 中 JWT 的签名、iss/aud/typ、有效期与用户状态；设计文档另加 `token_version` 比对（改密后旧令牌返回 401 `TOKEN_REVOKED`）。
      x-implementation-status: implemented
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: 当前用户；设计文档要求追加 displayName、bio、emailVerified、avatarUrl
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthUserResponse'}
              example:
                user:
                  id: 0b6f3c1e-8f0a-4f5d-9c3a-2a1f6f0d7c11
                  username: museum_fan
                  email: museum@example.com
                  displayName: 老周
                  bio: 记录和分享软件资料。
                  emailVerified: false
                  avatarUrl: null
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/auth/logout:
    post:
      tags: [认证]
      operationId: logoutUser
      summary: 退出登录
      description: 无请求体；服务端把 JWT 的 jti 记入失效列表并清除 Cookie。未登录或令牌失效时同样清除 Cookie 并返回 401。
      x-implementation-status: implemented
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      responses:
        '204':
          description: 已退出并清除 Cookie
          headers:
            Set-Cookie:
              schema: {type: string}
              example: 'museum_access_token=; Path=/api; Max-Age=0; HttpOnly; Secure; SameSite=Lax'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/RequestForbidden'}

  /api/auth/email-verification/request:
    post:
      tags: [认证]
      operationId: requestEmailVerification
      summary: 请求邮箱验证
      description: 设计。向账号当前邮箱发送验证链接（24 小时有效）；同一账号 10 分钟内重复申请返回 429。邮件发送失败也不回显原因，仍返回 202。
      x-implementation-status: design
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      responses:
        '202': {description: 已受理（无论是否真正发送）}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/RequestForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/auth/email-verification/confirm:
    post:
      tags: [认证]
      operationId: confirmEmailVerification
      summary: 确认邮箱验证
      description: 设计。邮件链接指向前端页面，由前端把 token 提交到本接口；令牌一次有效，成功写入 `email_verified_at`。
      x-implementation-status: design
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
            example: {token: 6d1c0f7a9b2e4d8c5a3f1e0b7c9d2a4f}
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                type: object
                properties: {emailVerified: {type: boolean, const: true}}
              example: {emailVerified: true}
        '400':
          description: 令牌无效、过期或已使用（`RESET_TOKEN_INVALID`）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: RESET_TOKEN_INVALID, message: 令牌无效或已失效, requestId: '3f2c9b1e', fieldErrors: {}}
        '403': {$ref: '#/components/responses/RequestForbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}

  /api/auth/password-reset/request:
    post:
      tags: [认证]
      operationId: requestPasswordReset
      summary: 申请找回密码
      description: |
        设计。`account` 可为用户名或注册邮箱。**无论账号是否存在、是否验证邮箱，一律返回 202**；
        仅当账号存在且邮箱已验证时才真正发送邮件（30 分钟有效令牌）。限速：同一 IP 10 分钟 3 次、同一账号 10 分钟 1 次。
      x-implementation-status: design
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account]
              properties:
                account: {type: string, minLength: 1, maxLength: 254, description: 用户名或邮箱}
            example: {account: museum_fan}
      responses:
        '202': {description: 已受理（不泄露账号是否存在）}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/RequestForbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/auth/password-reset/confirm:
    post:
      tags: [认证]
      operationId: confirmPasswordReset
      summary: 确认重置密码
      description: 设计。令牌一次有效；成功后更新密码哈希、递增 `token_version`（所有旧 JWT 立即失效）、消费令牌并作废同用户其他重置令牌。
      x-implementation-status: design
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
            example: {token: 6d1c0f7a9b2e4d8c5a3f1e0b7c9d2a4f, newPassword: brand-new-passphrase}
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                type: object
                properties: {reset: {type: boolean, const: true}}
              example: {reset: true}
        '400':
          description: 令牌无效/过期/已用（`RESET_TOKEN_INVALID`）或新密码不合法（`VALIDATION_ERROR`）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: RESET_TOKEN_INVALID, message: 令牌无效或已失效, requestId: '3f2c9b1e', fieldErrors: {}}
        '403': {$ref: '#/components/responses/RequestForbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}

  /api/me/profile:
    patch:
      tags: [个人资料]
      operationId: updateMyProfile
      summary: 修改本人资料
      description: 设计。只改传入字段；`displayName` 空串/null 表示清除并回退 `username`，`bio` 最多 200 字符。用户名、邮箱、密码不在此接口修改。
      x-implementation-status: design
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProfileRequest'}
            example: {displayName: 老周, bio: 记录和分享软件资料。}
      responses:
        '200':
          description: 更新后的本人资料
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileUserResponse'}
              example:
                user:
                  id: 0b6f3c1e-8f0a-4f5d-9c3a-2a1f6f0d7c11
                  username: museum_fan
                  displayName: 老周
                  bio: 记录和分享软件资料。
                  avatarUrl: /api/users/0b6f3c1e-8f0a-4f5d-9c3a-2a1f6f0d7c11/avatar
                  createdAt: '2026-09-01T08:00:00Z'
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/RequestForbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}

  /api/me/avatar:
    post:
      tags: [个人资料]
      operationId: uploadMyAvatar
      summary: 上传头像
      description: 设计。multipart 字段名 `image`；真实 PNG/JPEG，原文件 ≤2 MiB，宽高 ≤2048、总像素 ≤400 万，服务端重编码为 PNG，随机文件名，替换时删除旧文件。返回 200 而非 201。
      x-implementation-status: design
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: {type: string, format: binary, description: PNG 或 JPEG，≤2 MiB}
      responses:
        '200':
          description: 头像已替换
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileUserResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/UploadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
    delete:
      tags: [个人资料]
      operationId: deleteMyAvatar
      summary: 删除头像
      description: 设计。幂等：本来没有头像也返回 204。
      x-implementation-status: design
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      responses:
        '204': {description: 已删除}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/RequestForbidden'}

  /api/me/password:
    put:
      tags: [个人资料]
      operationId: changeMyPassword
      summary: 修改密码
      description: |
        设计。`currentPassword` 错误返回 400（不是 401，避免前端误判掉登录）；`newPassword` 4～64 码点且不得与旧密码相同。
        成功后递增 `token_version`（其它设备的 JWT 立即失效）、作废未使用的重置令牌，并清除本响应 Cookie。
        同一用户 10 分钟内失败 5 次后返回 429。
      x-implementation-status: design
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/AppRequestHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
            example: {currentPassword: old-passphrase-2026, newPassword: new-passphrase-2026}
      responses:
        '204':
          description: 密码已修改，Cookie 已清除
          headers:
            Set-Cookie:
              schema: {type: string}
              example: 'museum_access_token=; Path=/api; Max-Age=0; HttpOnly; Secure; SameSite=Lax'
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/RequestForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/me/favorites:
    get:
      tags: [个人资料]
      operationId: listMyFavorites
      summary: 我的收藏
      description: 设计。按收藏时间倒序；只能看自己的收藏。对象已删除时跳过，不返回空洞项。
      x-implementation-status: design
      security: [{cookieAuth: []}]
      parameters:
        - name: target
          in: query
          required: true
          description: 收藏对象类型
          schema: {type: string, enum: [SERIES, VERSION]}
        - name: q
          in: query
          description: 按名称子串过滤，1～100 字符
          schema: {type: string, maxLength: 100}
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 收藏列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoriteList'}
              example:
                items:
                  - targetType: SERIES
                    favoritedAt: '2026-10-30T08:00:00Z'
                    series:
                      id: 7d2f9a4c-1b3e-4c5a-8d6f-0e9b2a1c3d4e
                      name: QQ 软件系列
                      description: 一款国民级聊天软件
                      category: INSTANT_MESSAGING
                      platforms: [WINDOWS, ANDROID]
                      iconUrl: /api/series/7d2f9a4c-1b3e-4c5a-8d6f-0e9b2a1c3d4e/icon
                      tags: [聊天, 社交]
                      versionCount: 24
                      favoriteCount: 8
                      status: PUBLISHED
                      updatedAt: '2026-10-27T08:00:00Z'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/me/drafts:
    get:
      tags: [草稿]
      operationId: listMyDrafts
      summary: 草稿箱
      description: 设计。只返回本人草稿，按 `updatedAt` 倒序；`missingFields` 由服务端计算发布还缺哪些项。
      x-implementation-status: design
      security: [{cookieAuth: []}]
      parameters:
        - name: target
          in: query
          description: 草稿类型
          schema: {type: string, enum: [ALL, SERIES, VERSION], default: ALL}
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 草稿列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftList'}
              example:
                items:
                  - targetType: VERSION
                    id: 5c1d7e9a-3f2b-4a6c-9d8e-1b0a2c3d4e5f
                    title: 未完成的资料整理
                    series: {id: 7d2f9a4c-1b3e-4c5a-8d6f-0e9b2a1c3d4e, name: QQ}
                    category: INSTANT_MESSAGING
                    updatedAt: '2026-10-27T08:00:00Z'
                    missingFields: [versionNumber, screenshots]
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/me/contributions:
    get:
      tags: [个人资料]
      operationId: listMyContributions
      summary: 我的发布与创建的系列
      description: 设计。本人视角，包含自己的草稿（草稿项带 draft 标记）；结构与公开贡献列表一致。
      x-implementation-status: design
      security: [{cookieAuth: []}]
      parameters:
        - name: type
          in: query
