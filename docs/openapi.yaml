openapi: 3.1.1
info:
  title: 数字博物馆注册登录
  version: 0.2.0
  description: |
    与当前 Spring Boot 实现同步：用户名和密码注册/登录，email 为可选资料且不用于登录。
    JWT 通过 HttpOnly Cookie 保存，有效期 30 分钟，无 refresh token，过期后重新登录。
    浏览器自动携带 Cookie，前端无需读取 Token 或设置 Authorization。所有 POST 校验 Origin 和 X-App-Request: museum-web。
    Origin 必须属于 MUSEUM_ALLOWED_ORIGINS。dev 环境不设置 Secure，正式部署需 HTTPS。
    本文覆盖认证；系列、版本、截图接口详见 backend/docs，接入状态见 docs/backend-integration.md。
paths:
  /api/auth/register:
    post:
      summary: 用户名注册
      parameters:
        - $ref: '#/components/parameters/AppRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {$ref: '#/components/schemas/Username'}
                password: {$ref: '#/components/schemas/Password'}
                email: {type: [string, 'null'], format: email, maxLength: 254, description: 可选资料，不验证归属、不要求唯一}
            example: {username: museum_reader, password: museum-passphrase-2026, email: museum@example.com}
      responses:
        '201':
          description: 注册成功，不自动登录
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '400': {description: 输入字段不合法，fieldErrors 返回具体字段错误}
        '403': {description: Origin 或 X-App-Request 不合法}
        '409': {description: 用户名已存在}
        '429': {description: 请求过于频繁，Retry-After 指示等待秒数}
  /api/auth/login:
    post:
      summary: 用户名登录
      parameters:
        - $ref: '#/components/parameters/AppRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {$ref: '#/components/schemas/Username'}
                password: {$ref: '#/components/schemas/Password'}
            example: {username: museum_reader, password: museum-passphrase-2026}
      responses:
        '200':
          description: 登录成功，正文不返回 Token；expiresAt 为 UTC 到期时间
          headers:
            Set-Cookie:
              schema: {type: string}
              example: 'museum_access_token=<JWT>; Path=/api; HttpOnly; Secure; SameSite=Lax; Max-Age=1800'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/UserResponse'
                  - type: object
                    required: [expiresAt]
                    properties:
                      expiresAt: {type: string, format: date-time}
        '400': {description: 输入字段不合法}
        '401': {description: 用户名或密码错误}
        '403': {description: Origin 或 X-App-Request 不合法}
        '429': {description: 请求过于频繁}
  /api/auth/me:
    get:
      summary: 获取当前用户
      security: [{CookieAuth: []}]
      responses:
        '200':
          description: 校验 JWT 和账号状态，返回当前用户
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {description: Cookie 缺失、JWT 无效/过期或账号失效}
  /api/auth/logout:
    post:
      summary: 退出登录
      description: 无需请求体，允许无效或缺失 Cookie。仅清除浏览器 Cookie；没有服务端撤销列表，已复制的 JWT 在到期前仍可能有效。
      parameters:
        - $ref: '#/components/parameters/AppRequest'
      responses:
        '204':
          description: 已清除 Cookie，不返回内容
          headers:
            Set-Cookie:
              schema: {type: string}
              example: 'museum_access_token=; Path=/api; HttpOnly; Secure; SameSite=Lax; Max-Age=0'
        '403': {description: Origin 或 X-App-Request 不合法}
components:
  parameters:
    AppRequest:
      name: X-App-Request
      in: header
      required: true
      schema: {type: string, const: museum-web}
  schemas:
    Username:
      type: string
      description: 去除首尾空格并转小写后，为 2–32 位英文字母、数字或下划线，唯一
      example: museum_reader
    Password:
      type: string
      format: password
      minLength: 4
      maxLength: 64
      description: 4–64 个 Unicode 码点，不去空格、不改大小写
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id, username, email]
          properties:
            id: {type: string, format: uuid}
            username: {type: string}
            email: {type: [string, 'null']}
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: museum_access_token
