        timeText: {type: [string, 'null'], maxLength: 100}

    Screenshot:
      type: object
      required: [id, versionId, imageUrl, width, height, createdBy, createdAt]
      properties:
        id: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        imageUrl: {type: string, description: '/api/screenshots/{id}/image'}
        caption: {type: [string, 'null'], maxLength: 500}
        sourceText: {type: [string, 'null'], maxLength: 200, description: 设计文档新增}
        timeText: {type: [string, 'null'], maxLength: 100, description: 设计文档新增}
        width: {type: integer}
        height: {type: integer}
        createdBy: {type: string, format: uuid}
