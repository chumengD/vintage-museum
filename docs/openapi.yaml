openapi: 3.1.1
info:
  title: 数字博物馆注册登录
  version: 0.1.0
  description: |
    邮箱和密码注册登录；JWT单Token通过HttpOnly Cookie保存，有效期暂定2小时，无刷新Token，过期后重新登录。目前仅为接口设计。
    浏览器自动携带Cookie，前端无需读取Token或设置Authorization请求头。前端与API同源，正式环境使用HTTPS。
    所有POST请求校验Origin，来源缺失、为null或不匹配服务端配置的可信来源时返回403，防止跨站请求伪造。
paths:
  /api/auth/register:
    post:
      summary: 邮箱注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, description: 邮箱}
                password: {type: string, format: password, description: 密码}
                emailcode: {type: integer, description: 邮箱验证码（选填，可暂不实现）}
            example: {email: museum@example.com, password: museum-passphrase-2026, emailcode: 114514}
      responses:
        '201':
          description: 注册成功，返回用户信息，前往登录
          content:
            application/json:
              example: {id: usr_123, email: museum@example.com}
        '400': {description: 参数不正确或邮箱格式错误}
        '401': {description: 验证码错误(可选)}
        '403': {description: 请求来源无效}
        '409': {description: 邮箱已注册}
  /api/auth/login:
    post:
      summary: 邮箱登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, description: 注册时的邮箱}
                password: {type: string, format: password, description: 密码}
            example: {email: museum@example.com, password: museum-passphrase-2026}
      responses:
        '200':
          description: 登录成功，通过Set-Cookie保存JWT；正文不返回Token，expiresIn单位为秒
          headers:
            Set-Cookie:
              schema: {type: string}
              example: 'access_token=<JWT>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=7200'
          content:
            application/json:
              example:
                expiresIn: 7200
                user: {id: usr_123, email: museum@example.com, displayName: 藏品爱好者}
        '400': {description: 参数不正确}
        '401': {description: 邮箱或密码错误}
        '403': {description: 请求来源无效}
  /api/auth/me:
    get:
      summary: 获取当前用户
      security: [{CookieAuth: []}]
      responses:
        '200':
          description: 校验Cookie中的JWT签名、有效期和失效列表，返回当前登录用户
          content:
            application/json:
              example:
                user: {id: usr_123, email: museum@example.com, displayName: 藏品爱好者}
        '401': {description: Token缺失、无效、已过期或已注销}
  /api/auth/logout:
    post:
      summary: 退出登录
      description: 无需请求体；服务端将Cookie中JWT的jti加入失效列表，保留至Token过期，并通过Set-Cookie清除Cookie。前端仅清除用户信息。
      security: [{CookieAuth: []}]
      responses:
        '204':
          description: 当前Token已注销并清除Cookie，不返回内容
          headers:
            Set-Cookie:
              schema: {type: string}
              example: 'access_token=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0'
        '401':
          description: Token缺失、无效、已过期或已注销，同时清除Cookie
          headers:
            Set-Cookie:
              schema: {type: string}
              example: 'access_token=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0'
        '403': {description: 请求来源无效，不注销Token或清除Cookie}
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
