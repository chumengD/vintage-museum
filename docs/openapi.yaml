        - $ref: '#/components/parameters/RevisionIdPath'
      responses:
        '200':
          description: 修订详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevisionDetailResponse'}
              example:
                revision:
                  id: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                  targetType: VERSION
                  targetId: 5c1d7e9a-3f2b-4a6c-9d8e-1b0a2c3d4e5f
                  targetLabel: QQ 9.9 版本记录
                  revisionNo: 3
                  editor: {id: 3c4d5e6f-7a8b-4c9d-0e1f-2a3b4c5d6e7f, displayName: 用户 B, avatarUrl: null}
                  changes:
                    - {field: releaseDateText, oldValue: null, newValue: 2001—2002 年}
                  note: 补充版本范围
                  createdAt: '2026-10-30T08:00:00Z'
        '404':
          description: 修订不存在（`REVISION_NOT_FOUND`）或对象为他人草稿
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /api/tags:
    get:
      tags: [标签]
      operationId: listTags
      summary: 标签列表与自动补全
      description: 设计。公开；按使用次数倒序（同次数按名称正序）；`usageCount` 只统计已发布系列与版本。
      x-implementation-status: design
      parameters:
        - name: q
          in: query
          description: 名称子串（大小写不敏感），1～20 字符
          schema: {type: string, minLength: 1, maxLength: 20}
        - name: limit
          in: query
          description: 返回数量
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TagList'}
              example:
                items:
                  - {id: 8f7e6d5c-4b3a-4f2e-9d1c-0b9a8f7e6d5c, name: 聊天, usageCount: 12}
                  - {id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d, name: 社交, usageCount: 8}
        '400': {$ref: '#/components/responses/ValidationError'}

  /api/search:
    get:
      tags: [搜索与统计]
      operationId: search
      summary: 全局搜索
      description: |
        设计。公开；数据库 `LIKE` 子串匹配（`%`、`_` 按字面转义），只搜已发布对象。
        `q` 与任一筛选至少给一个，否则 400 `SEARCH_CRITERIA_REQUIRED`。`counts` 为命中的系列/版本总数（不受分页影响）。
      x-implementation-status: design
      parameters:
        - name: q
          in: query
          description: 关键词，1～100 字符
          schema: {type: string, maxLength: 100}
        - name: type
          in: query
          description: 结果类型
          schema: {type: string, enum: [ALL, SERIES, VERSION], default: ALL}
        - name: category
          in: query
          description: 系列分类（只影响系列结果与版本所属系列）
          schema: {type: string, enum: [INSTANT_MESSAGING, BROWSER, MEDIA, OTHER]}
        - name: platform
          in: query
          description: 平台代码
          schema: {type: string, enum: [WINDOWS, ANDROID, IOS, MACOS, LINUX, OTHER]}
        - name: tag
          in: query
          description: 标签名（大小写不敏感）
          schema: {type: string, maxLength: 20}
        - name: sort
          in: query
          description: 排序
          schema: {type: string, enum: [UPDATED, CREATED, NAME, RELEVANCE], default: UPDATED}
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
              example:
                query: QQ
                items:
                  - type: SERIES
                    series:
                      id: 7d2f9a4c-1b3e-4c5a-8d6f-0e9b2a1c3d4e
                      name: QQ
                      description: 一款国民级聊天软件
                      category: INSTANT_MESSAGING
                      platforms: [WINDOWS, ANDROID]
                      iconUrl: /api/series/7d2f9a4c-1b3e-4c5a-8d6f-0e9b2a1c3d4e/icon
                      tags: [聊天, 社交]
                      versionCount: 24
                      favoriteCount: 8
                      updatedAt: '2026-10-27T08:00:00Z'
                  - type: VERSION
                    version: {id: 5c1d7e9a-3f2b-4a6c-9d8e-1b0a2c3d4e5f, versionNumber: '9.9', platform: WINDOWS, updatedAt: '2026-10-27T08:00:00Z'}
                    series: {id: 7d2f9a4c-1b3e-4c5a-8d6f-0e9b2a1c3d4e, name: QQ, iconUrl: /api/series/7d2f9a4c-1b3e-4c5a-8d6f-0e9b2a1c3d4e/icon}
                counts: {series: 1, versions: 1}
                page: 0
                size: 20
                totalElements: 2
                totalPages: 1
        '400': {$ref: '#/components/responses/ValidationError'}

  /api/stats/overview:
    get:
      tags: [搜索与统计]
      operationId: getStatsOverview
      summary: 站点统计
      description: 设计。公开；全部排除草稿；`contributorCount` 为修订记录中去重的编辑者数；`lastUpdatedAt` 取全站最大 `updatedAt`。
      x-implementation-status: design
      responses:
        '200':
          description: 站点统计
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatsOverview'}
              example:
                seriesCount: 36
                versionCount: 412
                screenshotCount: 1873
                contributorCount: 58
                commentCount: 240
                favoriteCount: 129
                tagCount: 74
                lastUpdatedAt: '2026-10-30T08:00:00Z'

  /api/stats/platforms:
    get:
      tags: [搜索与统计]
      operationId: getPlatformStats
      summary: 平台分布
      description: 设计。公开；按 `versionCount` 倒序，只含已发布数据；没有数据的平台不出现。
      x-implementation-status: design
      responses:
        '200':
          description: 平台分布
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformStats'}
              example:
                items:
                  - {platform: WINDOWS, seriesCount: 30, versionCount: 240}
                  - {platform: ANDROID, seriesCount: 12, versionCount: 96}

  /api/stats/timeline:
    get:
      tags: [搜索与统计]
      operationId: getTimeline
      summary: 版本时间线
      description: 设计。公开；只统计 `dateStatus=EXACT` 且 `releaseDate` 非空的版本；`RANGE`/`UNKNOWN` 计入 `unknownCount`；年份跨度上限 100 年。
      x-implementation-status: design
      parameters:
        - name: from
          in: query
          description: 起始年份
          schema: {type: integer, minimum: 1, maximum: 9999}
        - name: to
          in: query
          description: 结束年份
          schema: {type: integer, minimum: 1, maximum: 9999}
      responses:
        '200':
          description: 时间线
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Timeline'}
        '400': {$ref: '#/components/responses/ValidationError'}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: museum_access_token
      description: 登录成功后由服务端写入的 HttpOnly JWT Cookie（30 分钟），前端不可读取。

  parameters:
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: 写请求必需，须属于服务端白名单（默认 localhost/127.0.0.1 的 5173、3000、8080 端口），否则 403。
      schema: {type: string, format: uri}
    AppRequestHeader:
      name: X-App-Request
      in: header
      required: true
      description: 写请求必需的防跨站标记，固定值 museum-web。
      schema: {type: string, enum: [museum-web]}
    PageParam:
      name: page
      in: query
      description: 页码，从 0 开始
      schema: {type: integer, minimum: 0, default: 0}
    SizeParam:
      name: size
      in: query
      description: 每页条数
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    SeriesIdPath:
      name: seriesId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersionIdPath:
      name: versionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ScreenshotIdPath:
      name: screenshotId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CommentIdPath:
      name: commentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RevisionIdPath:
      name: revisionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}

  responses:
    ValidationError:
      description: 参数、请求体、分页或 UUID 不合法（`VALIDATION_ERROR`，`fieldErrors` 指出字段）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            code: VALIDATION_ERROR
            message: 请求参数不合法
            requestId: '3f2c9b1e'
            fieldErrors: {name: 名称长度须为 1～100 个字符}
    Unauthorized:
      description: 未登录或凭据失效（`AUTH_REQUIRED` / `AUTH_INVALID` / `TOKEN_INVALID` / `TOKEN_EXPIRED` / `TOKEN_REVOKED`）
      headers:
        Set-Cookie:
          description: 令牌失效时可能被清除
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: AUTH_REQUIRED, message: 请先登录, requestId: '3f2c9b1e', fieldErrors: {}}
    RequestForbidden:
      description: 写请求缺少白名单 Origin 或 X-App-Request（`REQUEST_FORBIDDEN`）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: REQUEST_FORBIDDEN, message: 请求来源或必要请求头不合法, requestId: '3f2c9b1e', fieldErrors: {}}
    NotFound:
      description: 对象不存在、已删除或不可见（具体 code 见各接口说明）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: SERIES_NOT_FOUND, message: 系列不存在, requestId: '3f2c9b1e', fieldErrors: {}}
    Conflict:
      description: 唯一性、状态或并发冲突（`SERIES_ALREADY_EXISTS` / `VERSION_ALREADY_EXISTS` / `SERIES_NOT_EMPTY` / `ALREADY_PUBLISHED` / `CONCURRENT_MODIFICATION`）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: CONCURRENT_MODIFICATION, message: 对象已被他人修改，请刷新后重试, requestId: '3f2c9b1e', fieldErrors: {}}
    UploadTooLarge:
      description: 上传超过限制（`UPLOAD_TOO_LARGE`）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: 请求体类型不符合约定（`UNSUPPORTED_MEDIA_TYPE`）
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: 触发限速（`LOGIN_RATE_LIMITED` / `REGISTER_RATE_LIMITED` / `RESET_RATE_LIMITED` / `PASSWORD_CHANGE_RATE_LIMITED`）
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: LOGIN_RATE_LIMITED, message: 请求过于频繁，请稍后再试, requestId: '3f2c9b1e', fieldErrors: {}}

  schemas:
    Error:
      type: object
      required: [code, message, requestId, fieldErrors]
      properties:
        code: {type: string, description: 稳定错误码，前端据此分支}
        message: {type: string, description: 面向用户的说明}
        requestId: {type: string, description: 与服务端日志关联的请求 ID}
        fieldErrors:
          type: object
          additionalProperties: {type: string}
          description: 字段名到错误说明；无字段错误时为 {}

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, pattern: '^[A-Za-z0-9_]{2,32}$', description: 2～32 位字母、数字、下划线，统一转小写}
        password: {type: string, minLength: 4, maxLength: 64, format: password, description: 按 Unicode 码点计 4～64}
        email: {type: string, format: email, maxLength: 254, description: 可选}

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, description: 注册时的用户名，大小写不敏感}
        password: {type: string, format: password}

    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, description: 邮件中的一次性令牌}

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token: {type: string}
        newPassword: {type: string, minLength: 4, maxLength: 64, format: password}

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, format: password}
        newPassword: {type: string, minLength: 4, maxLength: 64, format: password}

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: {type: [string, 'null'], maxLength: 40, description: 空/null 清除并回退 username}
        bio: {type: [string, 'null'], maxLength: 200}

    UserBrief:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        displayName: {type: [string, 'null'], description: 为空时前端回退 username}
        avatarUrl: {type: [string, 'null']}

    PublicUser:
      type: object
      required: [id, username]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        displayName: {type: [string, 'null']}
        bio: {type: [string, 'null']}
        avatarUrl: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}

    AuthUser:
      type: object
      required: [id, username]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: [string, 'null'], format: email, description: 仅本人接口返回}
        displayName: {type: [string, 'null']}
        bio: {type: [string, 'null']}
        emailVerified: {type: boolean, description: 设计文档新增}
        avatarUrl: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}

    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/AuthUser'}

    LoginResponse:
      type: object
      required: [user, expiresAt]
      properties:
        user: {$ref: '#/components/schemas/AuthUser'}
        expiresAt: {type: string, format: date-time, description: JWT 过期时间}

    ProfileUserResponse:
      type: object
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/PublicUser'}

    Pagination:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}

    SeriesMetadata:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, minLength: 1, maxLength: 1000, description: 草稿可缺省}
        category: {type: string, enum: [INSTANT_MESSAGING, BROWSER, MEDIA, OTHER], description: 草稿可缺省}
        platforms:
          type: array
          items: {type: string, enum: [WINDOWS, ANDROID, IOS, MACOS, LINUX, OTHER]}
          maxItems: 6
          description: 发布时非空且不重复；草稿可为空数组
        status: {type: string, enum: [DRAFT, PUBLISHED], default: PUBLISHED, description: 设计文档新增}
        tags:
          type: array
          items: {type: string, minLength: 1, maxLength: 20}
          maxItems: 10
          description: 设计文档新增，整体替换
        sourceUrl: {type: [string, 'null'], maxLength: 500, description: 设计文档新增，http/https}

    Series:
      type: object
      required: [id, name, description, category, platforms, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, maxLength: 100}
        description: {type: string, maxLength: 1000}
        category: {type: string, enum: [INSTANT_MESSAGING, BROWSER, MEDIA, OTHER]}
        platforms:
          type: array
          maxItems: 6
          items: {type: string, enum: [WINDOWS, ANDROID, IOS, MACOS, LINUX, OTHER]}
        iconUrl: {type: [string, 'null'], description: 无图标为 null}
        sourceUrl: {type: [string, 'null'], description: 设计文档新增}
        tags:
          type: array
          items: {type: string}
          description: 设计文档新增
        status: {type: string, enum: [DRAFT, PUBLISHED], description: 设计文档新增}
        publishedAt: {type: [string, 'null'], format: date-time, description: 设计文档新增}
        versionCount: {type: integer, description: 设计文档新增，只统计已发布版本}
        favoriteCount: {type: integer, description: 设计文档新增}
        favoritedByMe: {type: boolean, description: 设计文档新增，匿名恒为 false}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    SeriesResponse:
      type: object
      required: [series]
      properties:
        series: {$ref: '#/components/schemas/Series'}

    SeriesList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Series'}

    SeriesWithRevision:
      type: object
      required: [series, revision]
      properties:
        series: {$ref: '#/components/schemas/Series'}
        revision: {$ref: '#/components/schemas/RevisionRef'}

    Version:
      type: object
      required: [id, seriesId, platform, createdBy, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        seriesId: {type: string, format: uuid}
        versionNumber: {type: [string, 'null'], maxLength: 100, description: numberStatus=EXACT 时使用}
        numberStatus: {type: string, enum: [EXACT, RANGE, UNKNOWN], description: 设计文档新增}
        numberText: {type: [string, 'null'], maxLength: 100, description: numberStatus=RANGE 时的范围文本}
        releaseDate: {type: [string, 'null'], format: date, description: dateStatus=EXACT 时使用}
        dateStatus: {type: string, enum: [EXACT, RANGE, UNKNOWN], description: 设计文档新增}
        releaseDateText: {type: [string, 'null'], maxLength: 100, description: dateStatus=RANGE 时的文本}
        platform: {type: string, enum: [WINDOWS, ANDROID, IOS, MACOS, LINUX, OTHER]}
        platformText: {type: [string, 'null'], maxLength: 100, description: 平台补充说明}
        description: {type: [string, 'null'], maxLength: 5000}
        body: {type: [string, 'null'], maxLength: 20000, description: 正文 Markdown 源文本}
        sourceUrl: {type: [string, 'null'], maxLength: 500}
        sourceNote: {type: [string, 'null'], maxLength: 200}
        iconUrl: {type: [string, 'null']}
        iconSource: {type: string, enum: [VERSION, SERIES, NONE], description: 版本图标回退来源}
        status: {type: string, enum: [DRAFT, PUBLISHED]}
        publishedAt: {type: [string, 'null'], format: date-time}
        commentCount: {type: integer, description: 含回复}
        favoriteCount: {type: integer}
        favoritedByMe: {type: boolean}
        tags:
          type: array
          items: {type: string}
        createdBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    VersionResponse:
      type: object
      required: [version]
      properties:
        version: {$ref: '#/components/schemas/Version'}

    VersionDetail:
      type: object
      required: [version, series]
      properties:
        version: {$ref: '#/components/schemas/Version'}
        series: {$ref: '#/components/schemas/SeriesBrief'}

    VersionList:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Version'}

    VersionWithRevision:
      type: object
      required: [version, revision]
      properties:
        version: {$ref: '#/components/schemas/Version'}
        revision: {$ref: '#/components/schemas/RevisionRef'}

    SeriesBrief:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        iconUrl: {type: [string, 'null']}

    CreateVersionRequest:
      type: object
      additionalProperties: false
      required: [platform]
      properties:
        versionNumber: {type: [string, 'null'], maxLength: 100}
        platform: {type: string, enum: [WINDOWS, ANDROID, IOS, MACOS, LINUX, OTHER]}
        releaseDate: {type: [string, 'null'], format: date, description: 严格 YYYY-MM-DD 的真实日期}
        description: {type: [string, 'null'], maxLength: 5000}
        numberStatus: {type: string, enum: [EXACT, RANGE, UNKNOWN], default: EXACT, description: 设计文档新增}
        numberText: {type: [string, 'null'], maxLength: 100}
        dateStatus: {type: string, enum: [EXACT, RANGE, UNKNOWN], default: EXACT, description: 设计文档新增}
        releaseDateText: {type: [string, 'null'], maxLength: 100}
        platformText: {type: [string, 'null'], maxLength: 100}
        body: {type: [string, 'null'], maxLength: 20000}
        sourceUrl: {type: [string, 'null'], maxLength: 500}
        sourceNote: {type: [string, 'null'], maxLength: 200}
        tags:
          type: array
          items: {type: string, minLength: 1, maxLength: 20}
          maxItems: 10
        iconChoice: {type: string, enum: [INHERIT, UPLOAD, NONE], default: INHERIT}
        screenshotsOmitted: {type: boolean, default: false, description: 明确选择「截图暂缺」}
        status: {type: string, enum: [DRAFT, PUBLISHED], default: PUBLISHED}

    UpdateSeriesRequest:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, minLength: 1, maxLength: 1000}
